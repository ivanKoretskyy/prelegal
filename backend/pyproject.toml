[project]
name = "backend"
version = "0.1.0"
description = "Prelegal FastAPI backend"
readme = "README.md"
authors = [
    { name = "Ivan Koretskyy", email = "ivankoretskyy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "litellm>=1.94.1",
    "pyjwt>=2.10.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
